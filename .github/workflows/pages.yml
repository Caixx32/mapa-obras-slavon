# Publica SOLO la carpeta public/ en GitHub Pages cada vez que se une algo a main.
# También se puede correr a mano: pestaña Actions → "Publicar en GitHub Pages" → Run workflow.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que no se publique nada interno
        run: |
          if find public -type f \( -iname '*.xlsx' -o -iname '*.kml' -o -iname '*.kmz' -o -iname '*_privada*' -o -iname 'obras-internas*' -o -iname 'geocache*' \) | grep -q .; then
            echo "::error::Hay archivos internos dentro de public/. No se publica."
            find public -type f \( -iname '*.xlsx' -o -iname '*.kml' -o -iname '*.kmz' -o -iname '*_privada*' -o -iname 'obras-internas*' -o -iname 'geocache*' \)
            exit 1
          fi
          test -s public/data/obras-publicas.json || { echo "::error::Falta public/data/obras-publicas.json"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
