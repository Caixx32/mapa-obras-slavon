# Publicación automática del mapa.
#   · Todas las noches a las 3 AM (hora de Argentina): lee el Google Sheet y la carpeta de Drive y publica si hubo cambios.
#   · Cada 5 minutos: le pone ID a las filas nuevas, crea sus carpetas de fotos y publica si se tildó «Publicar ahora» en AVISOS.
#   · Cuando cambia el código (push a main) o se corre a mano: publica siempre.
# Si algo falla, la web anterior sigue online y el motivo queda escrito en la pestaña AVISOS del Sheet.
# Sin el secret GOOGLE_SA_KEY funciona como antes: publica lo que hay en public/.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'     # 06:00 UTC = 03:00 en Argentina
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'manual = publica siempre · nocturno = publica solo si hubo cambios · poll = solo IDs y carpetas nuevas (y publica si está tildado «Publicar ahora»)'
        default: manual

permissions:
  contents: write           # solo para dejar una marca de actividad en la rama «actividad» (ver el último paso)
  pages: write
  id-token: write
  deployments: read         # para encontrar despliegues de GitHub Pages que quedaron trabados

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publicar: ${{ steps.sitio.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que no se publique nada interno
        run: |
          if find public -type f \( -iname '*.xlsx' -o -iname '*.kml' -o -iname '*.kmz' -o -iname '*_privada*' -o -iname '*privada*' -o -iname 'obras-internas*' -o -iname 'geocache*' \) | grep -q .; then
            echo "::error::Hay archivos internos dentro de public/. No se publica."
            exit 1
          fi
          test -s public/data/obras-publicas.json || { echo "::error::Falta public/data/obras-publicas.json"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Fotos ya optimizadas (para no volver a procesarlas)
        id: cache-fotos
        uses: actions/cache/restore@v4
        with:
          path: .cache-fotos
          key: fotos-${{ github.run_id }}
          restore-keys: fotos-

      - name: Leer el Sheet y Drive y armar la web
        id: sitio
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          EVENTO: ${{ github.event_name }}
          PROGRAMACION: ${{ github.event.schedule }}
          MODO_PEDIDO: ${{ inputs.modo }}
        run: |
          case "$EVENTO" in
            schedule) if [ "$PROGRAMACION" = "0 6 * * *" ]; then MODO=nocturno; else MODO=poll; fi ;;
            push) MODO=push ;;
            *) case "$MODO_PEDIDO" in nocturno|poll) MODO="$MODO_PEDIDO" ;; *) MODO=manual ;; esac ;;
          esac
          node scripts/ci-sheet.mjs --modo=$MODO

      - name: Guardar las fotos optimizadas
        if: steps.sitio.outputs.publicar == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache-fotos
          key: fotos-${{ github.run_id }}

      - uses: actions/configure-pages@v5
        if: steps.sitio.outputs.publicar == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.sitio.outputs.publicar == 'true'
        with:
          path: _site

      # GitHub pausa los programas automáticos de un repositorio público sin actividad en 60 días: dejamos una marca diaria.
      - name: Marca de actividad
        if: github.event.schedule == '0 6 * * *'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/actividad" >/dev/null 2>&1 || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/actividad -f sha="$GITHUB_SHA" >/dev/null
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/ultima-actividad.txt?ref=actividad" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ultima-actividad.txt" -f message="Marca de actividad" -f content="$(date -u +%FT%TZ | base64)" -f branch=actividad ${SHA:+-f sha=$SHA} >/dev/null

  desplegar:
    needs: preparar
    if: needs.preparar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.reintento.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # Si un despliegue anterior quedó «en curso» para siempre, GitHub Pages rechaza todos los nuevos.
      # Como las corridas van de a una (concurrency), cualquier despliegue en curso es viejo: se cancela.
      - name: Liberar despliegues trabados
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=5" --jq '.[].sha' | sort -u); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" >/dev/null 2>&1 || true
          done

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # GitHub Pages a veces está terminando otro despliegue y rechaza el nuevo: se espera y se reintenta una vez.
      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 150

      - id: reintento
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Si el despliegue falló de verdad, queda escrito en AVISOS (la web anterior sigue online y la próxima corrida lo reintenta).
  avisar:
    needs: [preparar, desplegar]
    if: always() && needs.desplegar.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node scripts/ci-sheet.mjs --modo=error-despliegue
