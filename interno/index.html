<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Mapa de obras · VERSIÓN INTERNA</title>
  <link rel="icon" type="image/svg+xml" href="../public/img/isotipo-rojo.svg">
  <link rel="stylesheet" href="../public/css/fonts.css">
  <link rel="stylesheet" href="../public/css/tokens.css">
  <link rel="stylesheet" href="../public/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../public/vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="../public/css/styles.css">
</head>
<body data-modo="interno" data-base="../public/">
  <div class="aviso-interno">Versión interna · nombres reales y ubicaciones exactas · NO compartir ni publicar</div>
  <header class="topbar">
    <img src="../public/img/logo-slavon-oscuro.svg" alt="SLAVON" width="214" height="20">
    <p class="tag">Mapa de obras · interno</p>
  </header>
  <main>
    <section class="mapa-seccion" style="height:calc(100dvh - var(--alto-topbar) - 28px)" aria-label="Mapa de obras">
      <div class="filtros" role="group" aria-label="Filtros del mapa">
        <div class="chips" id="chips"></div>
        <input id="buscador" class="buscador" type="search" placeholder="Buscar club, cliente, ciudad…" aria-label="Buscar">
        <select id="provincia" class="select-provincia" aria-label="Provincia"></select>
      </div>
      <div class="mapa-wrap">
      <div id="mapa" role="region" aria-label="Mapa interactivo de obras"></div>
      <p class="conteo" id="conteo" aria-live="polite"></p>
      <div class="vacio" id="vacio" hidden>
        <p>No hay obras con esos filtros.</p>
        <button type="button" class="btn secundario">Quitar filtros</button>
      </div>
      <aside id="tarjeta" class="tarjeta" aria-hidden="true"></aside>
      </div>
    </section>
  </main>
  <script src="../public/vendor/leaflet/leaflet.js"></script>
  <script src="../public/vendor/markercluster/leaflet.markercluster.js"></script>
  <script type="module" src="../public/js/app.js"></script>
</body>
</html>
